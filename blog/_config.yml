title: "Project X"
tagline: "Building a drone from zero"
description: >-
  A public build log: designing, building, and flying a custom drone from
  scratch, with the reasoning behind every decision written down as it happens.

author:
  name: "Joshua Gifford"
  email: "joshuagifford237@gmail.com"

# Shown on /contact/ and in the site footer. Change here, not in the templates.
contact:
  email: "joshuagifford237@gmail.com"
  phone: "610-389-5374"
  phone_href: "+16103895374"

# ---------------------------------------------------------------------------
# url is your GitHub Pages domain. baseurl is injected by the build workflow
# (--baseurl), so leave it empty here — do not hardcode the repo name.
# ---------------------------------------------------------------------------
url: "https://jdgiffs237-cmd.github.io"
baseurl: ""

# ---------------------------------------------------------------------------
# Comments (Cusdis) — readers post with just a name, no account required.
# Paste the App ID from https://cusdis.com/dashboard here to switch them on.
# Left empty, the comments block falls back to a link to the contact page.
# ---------------------------------------------------------------------------
cusdis:
  app_id: "c30e7086-1bcb-4b5a-a2d7-b3ec22d996db"
  host: "https://cusdis.com"

permalink: /:year/:month/:day/:title/
timezone: America/New_York

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: /feed.xml

# Newest first on the index page.
paginate: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
